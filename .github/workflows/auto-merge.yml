# Merges a pull request by itself, but only after its "Android APK" run (the
# Tests job) has finished and passed. It does not depend on branch rules:
# nothing merges unless this file sees a green run for that exact commit.
#
# After a merge it starts the Android APK workflow on main by hand, because
# a merge made with the built-in token doesn't start it. That run tests main,
# builds the APK and publishes the update to the BETA channel only.
# Production is never sent from here.
name: Auto-merge

on:
  workflow_run:
    workflows: ['Android APK']
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge:
    name: Merge after Tests pass
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      PR: ${{ github.event.workflow_run.pull_requests[0].number }}
    steps:
      - name: Merge if ready (open, not a draft, same commit, targets main)
        run: |
          [ -n "$PR" ] || { echo "No pull request on this run."; exit 0; }
          info=$(gh pr view "$PR" --json state,isDraft,baseRefName,headRefOid)
          echo "$info"
          [ "$(echo "$info" | jq -r .state)" = OPEN ] || exit 0
          [ "$(echo "$info" | jq -r .isDraft)" = false ] || { echo "Draft: not merging."; exit 0; }
          [ "$(echo "$info" | jq -r .baseRefName)" = main ] || exit 0
          [ "$(echo "$info" | jq -r .headRefOid)" = "$SHA" ] || { echo "PR changed since this run: not merging."; exit 0; }
          gh pr merge "$PR" --squash --match-head-commit "$SHA"
          # Merges by the built-in token don't start the push workflow: start it.
          gh workflow run android-apk.yml --ref main
